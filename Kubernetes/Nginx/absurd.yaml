apiVersion: v1
kind: Namespace
metadata:
  name: absurd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: absurd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: absurd
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
